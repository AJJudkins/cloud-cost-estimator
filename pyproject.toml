[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-cost-estimator"
version = "0.2.0"
description = "Monthly cost estimator using a bundled table of clearly-labelled EXAMPLE prices."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = ["pytest"]

[project.scripts]
cloud-cost-estimator = "estimator:main"

[tool.setuptools]
py-modules = ["estimator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
